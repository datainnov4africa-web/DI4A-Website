<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Connectivity tiles, a speed gauge and a population grid">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00392A"/>
      <stop offset="0.55" stop-color="#00553A"/>
      <stop offset="1" stop-color="#00704A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5C242"/>
      <stop offset="1" stop-color="#E9A825"/>
    </linearGradient>
    <linearGradient id="speed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00A86A"/>
      <stop offset="1" stop-color="#F5C242"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#00291C" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- map tiles (quadkeys) with speed intensity -->
  <g opacity="0.95">
    <g fill="#00A86A">
      <rect x="110" y="140" width="70" height="70" rx="6" fill-opacity="0.25"/>
      <rect x="190" y="140" width="70" height="70" rx="6" fill-opacity="0.45"/>
      <rect x="270" y="140" width="70" height="70" rx="6" fill-opacity="0.7"/>
      <rect x="350" y="140" width="70" height="70" rx="6" fill-opacity="0.35"/>
      <rect x="110" y="220" width="70" height="70" rx="6" fill-opacity="0.4"/>
      <rect x="190" y="220" width="70" height="70" rx="6" fill-opacity="0.85"/>
      <rect x="270" y="220" width="70" height="70" rx="6" fill="#F5C242" fill-opacity="0.9"/>
      <rect x="350" y="220" width="70" height="70" rx="6" fill-opacity="0.6"/>
      <rect x="430" y="220" width="70" height="70" rx="6" fill-opacity="0.25"/>
      <rect x="110" y="300" width="70" height="70" rx="6" fill-opacity="0.2"/>
      <rect x="190" y="300" width="70" height="70" rx="6" fill-opacity="0.55"/>
      <rect x="270" y="300" width="70" height="70" rx="6" fill="#F5C242" fill-opacity="0.75"/>
      <rect x="350" y="300" width="70" height="70" rx="6" fill="#F5C242" fill-opacity="0.5"/>
      <rect x="430" y="300" width="70" height="70" rx="6" fill-opacity="0.35"/>
      <rect x="190" y="380" width="70" height="70" rx="6" fill-opacity="0.3"/>
      <rect x="270" y="380" width="70" height="70" rx="6" fill-opacity="0.5"/>
      <rect x="350" y="380" width="70" height="70" rx="6" fill-opacity="0.3"/>
      <rect x="270" y="460" width="70" height="70" rx="6" fill-opacity="0.2"/>
    </g>
    <!-- population dots -->
    <g fill="#ffffff" fill-opacity="0.8">
      <circle cx="300" cy="255" r="4"/><circle cx="318" cy="268" r="3"/><circle cx="286" cy="275" r="2.5"/>
      <circle cx="226" cy="252" r="3"/><circle cx="236" cy="270" r="2"/><circle cx="305" cy="330" r="3"/>
      <circle cx="380" cy="335" r="2.5"/><circle cx="372" cy="252" r="2"/><circle cx="320" cy="320" r="2"/>
    </g>
  </g>

  <!-- speed gauge -->
  <g transform="translate(820 360)" filter="url(#shadow)">
    <circle r="205" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
    <path d="M-170 60 A180 180 0 1 1 170 60" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="26" stroke-linecap="round"/>
    <path d="M-170 60 A180 180 0 0 1 100 -150" fill="none" stroke="url(#speed)" stroke-width="26" stroke-linecap="round"/>
    <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="3">
      <line x1="-150" y1="0" x2="-130" y2="0"/><line x1="-106" y1="-106" x2="-92" y2="-92"/>
      <line x1="0" y1="-150" x2="0" y2="-130"/><line x1="106" y1="-106" x2="92" y2="-92"/><line x1="150" y1="0" x2="130" y2="0"/>
    </g>
    <line x1="0" y1="0" x2="88" y2="-118" stroke="#F5C242" stroke-width="8" stroke-linecap="round"/>
    <circle r="16" fill="#F5C242"/>
    <circle r="7" fill="#00392A"/>
    <text x="0" y="110" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" fill-opacity="0.9">Mbps</text>
  </g>

  <!-- signal arcs -->
  <g fill="none" stroke="#F5C242" stroke-width="6" stroke-linecap="round" opacity="0.9" transform="translate(560 120)">
    <path d="M0 60 A60 60 0 0 1 60 0" opacity="0.4"/>
    <path d="M0 95 A95 95 0 0 1 95 0" opacity="0.6"/>
    <path d="M0 130 A130 130 0 0 1 130 0" opacity="0.8"/>
    <circle cx="0" cy="130" r="0"/>
  </g>
  <circle cx="560" cy="250" r="9" fill="#F5C242"/>
</svg>
