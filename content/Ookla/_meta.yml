# ---------------------------------------------------------------------------
# Theme metadata — Connectivity & big data at scale (folder: content/Ookla)
# ---------------------------------------------------------------------------
order: 3
icon: globe
cover: _cover.svg

title:
  en: Connectivity Data & Big Data at Scale
  fr: Données de connectivité et big data à l'échelle

description:
  en: >-
    Turn hundreds of millions of crowdsourced Ookla Speedtest tiles into a population-weighted,
    subnational connectivity indicator with WorldPop. Along the way, discover the six building blocks
    of a big-data platform for official statistics and put the Elastic Stack to work: index, map and
    publish a presentation-ready dashboard from one country code.
  fr: >-
    Transformez des centaines de millions de tuiles Ookla Speedtest issues de mesures participatives
    en un indicateur de connectivité infranational pondéré par la population avec WorldPop. Au
    passage, découvrez les six briques d'une plateforme big data pour la statistique officielle et
    mettez la suite Elastic au travail : indexer, cartographier et publier un tableau de bord prêt à
    présenter à partir d'un seul code pays.

documents:

  1045_hands-on_EN_DI4A.ipynb:
    order: 1
    download: Connectivity_Gap_Ookla_Open_Data_And_WorldPop_Lab
    title:
      en: "Lab — Measuring the connectivity gap with Ookla Open Data and WorldPop"
      fr: "Lab — Mesurer la fracture de connectivité avec les données ouvertes Ookla et WorldPop"
    description:
      en: >-
        Give the notebook one country code and get back a published dashboard. In between it runs the
        whole data value chain: download Ookla Speedtest tiles, cross them with the WorldPop population
        grid, compute population-weighted download and upload speeds by region and publish the result.
      fr: >-
        Donnez un code pays au notebook et récupérez un tableau de bord publié. Entre les deux, il
        déroule toute la chaîne de valeur des données : téléchargement des tuiles Ookla Speedtest,
        croisement avec la grille de population WorldPop, calcul des débits pondérés par la population
        par région et publication du résultat.

