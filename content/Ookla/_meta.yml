      fr: "Les moteurs du passage à l'échelle : technologies big data pour les systèmes statistiques"
    description:
      en: >-
        From raw files to trusted indicators: the six building blocks behind every data platform
        (ingestion, storage, processing, search, serving, governance), the memory wall and three ways
        past it, illustrated with Ookla tiles, WorldPop grids and NASA night-time lights.
      fr: >-
        Des fichiers bruts aux indicateurs fiables : les six briques de toute plateforme de données
