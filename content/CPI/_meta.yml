        robots.txt) ; toute la chaîne en un schéma ; les trois carnets et la classification par règles,
        embeddings et modèles de langage ; les calculs déroulés sur des cas réels ; comment lancer et
        reprendre une campagne ; les données collectées ; portée, limites et sources. Quarante-trois
        diapositives.

  CPI_AfDB.zip:
    order: 3
    lang: both                     # one archive, notebooks in English and in French
    group: price-index-toolkit     # stable identifier of the card
    download: Online_Price_Index_Toolkit_Notebooks_Code_Baskets_And_Sample_Data
    title:
      en: "Toolkit — the three price-index notebooks with their code, baskets and sample data"
      fr: "Boîte à outils — les trois carnets de l'indice des prix avec leur code, paniers et données d'exemple"
    description:
      en: >-
        Everything needed to run the chain on your own workstation: the three notebooks in English
        and in French (collect e-commerce prices, complete with official sources, classify and
        compute the index), the shared code engine, the baskets and official weights of eight
        countries (Côte d'Ivoire, Egypt, Ghana, Kenya, Morocco, Nigeria, Senegal, Uganda), sample
        data, the archives already collected per country, set-up scripts for Windows, macOS and
        Linux, and a README. Requires Python 3.10 or later; the two collection notebooks run on the
        institute's computer, the analysis notebook also runs in Google Colab.
      fr: >-
        Tout ce qu'il faut pour exécuter la chaîne sur votre propre poste : les trois carnets en
        français et en anglais (collecter les prix du commerce en ligne, compléter avec les sources
        officielles, classer et calculer l'indice), le moteur de code commun, les paniers et
        pondérations officielles de huit pays (Côte d'Ivoire, Égypte, Ghana, Kenya, Maroc, Nigeria,
        Sénégal, Ouganda), des données d'exemple, les archives déjà collectées par pays, les scripts
        d'installation pour Windows, macOS et Linux, et un guide de démarrage. Nécessite Python 3.10
        ou plus ; les deux carnets de collecte tournent sur le poste de l'institut, le carnet
        d'analyse tourne aussi dans Google Colab.

