# ---------------------------------------------------------------------------
# Theme metadata — Price statistics (folder: content/CPI)
# ---------------------------------------------------------------------------
order: 4
icon: chart
cover: _cover.svg

title:
  en: Price Statistics & Alternative Data for the CPI
  fr: Statistiques des prix et données alternatives pour l'IPC

description:
  en: >-
    The consumer price index guides monetary policy, indexes wages and deflates the national
    accounts: a one-point error is paid for everywhere. This theme covers the CPI from definition to
    compilation and the COICOP 2018 classification that structures the basket, then shows how an
    experimental price index is built from the web: e-commerce sites and official publications in
    eight African countries, with a complete toolkit of three notebooks, code, baskets and sample data.
  fr: >-
    L'indice des prix à la consommation guide la politique monétaire, indexe les salaires et déflate
    les comptes nationaux : une erreur d'un point se paie partout. Ce thème couvre l'IPC de la
    définition au calcul et la nomenclature COICOP 2018 qui structure le panier, puis montre comment
    construire un indice de prix expérimental à partir du web : sites de commerce en ligne et
    publications officielles de huit pays africains, avec une boîte à outils complète de trois
    carnets, code, paniers et données d'exemple.

documents:

  CPI_COICOP2018_AfDB_EN.pdf:
    order: 1
    group: cpi-coicop-deck         # pairs the EN and FR decks whose file names differ
    download: Consumer_Price_Index_COICOP_Classification_And_Online_Prices
    title:
      en: "The consumer price index: from COICOP 2018 to online prices"
      fr: "L'indice des prix à la consommation : de la COICOP 2018 aux prix en ligne"
    description:
      en: >-
        Definition, basket, weights and compilation methods of the CPI, the harmonised index of the
        West African Economic and Monetary Union, the COICOP 2018 classification, and how online and
        institutional prices can complement price collection in Côte d'Ivoire and Senegal.
      fr: >-
        Définition, panier, pondérations et méthodes de calcul de l'IPC, l'indice harmonisé de
        l'UEMOA, la nomenclature COICOP 2018, et comment les prix en ligne et les prix publiés par les
        institutions peuvent compléter la collecte en Côte d'Ivoire et au Sénégal.

  IPC_COICOP2018_AfDB_FR.pdf:
    order: 1
    group: cpi-coicop-deck
    download: Consumer_Price_Index_COICOP_Classification_And_Online_Prices
    title:
      en: "The consumer price index: from COICOP 2018 to online prices"
      fr: "L'indice des prix à la consommation : de la COICOP 2018 aux prix en ligne"
    description:
      en: >-
        French version of the deck: CPI definition, basket and compilation, COICOP 2018, and online
        prices as a complement to collection.
      fr: >-
        Définition, panier, pondérations et méthodes de calcul de l'IPC, l'indice harmonisé de
        l'UEMOA, la nomenclature COICOP 2018, et comment les prix en ligne et les prix publiés par les
        institutions peuvent compléter la collecte en Côte d'Ivoire et au Sénégal.

  A-price-index-built-from-the-web_AfDB-DI4A.pdf:
    order: 2
    lang: en                       # no language token in the file name
    group: web-price-index-deck    # pairs the EN and FR decks whose file names differ
    download: A_Price_Index_Built_From_The_Web_Three_Notebooks_Eight_Countries
    title:
      en: "A price index built from the web — three notebooks, eight countries, two families of sources"
      fr: "Un indice de prix à partir du web — trois carnets, huit pays, deux familles de sources"
    description:
      en: >-
        How an experimental price index is built from e-commerce sites and official publications in
        eight African countries. The purpose and what the device does not measure; the concepts
        (COICOP 2018, basket, variety, SKU, matched models, weights, robots.txt); the whole chain in
        one diagram; the three notebooks and classification by rules, embeddings and language models;
        the calculations walked through on real cases; how to run and resume a campaign; the data
        collected; scope, limits and sources. Forty-three slides.
      fr: >-
        Comment un indice de prix expérimental est construit à partir des sites de commerce en ligne
        et des publications officielles de huit pays africains. L'objectif et ce que le dispositif ne
        mesure pas ; les concepts (COICOP 2018, panier, variété, SKU, modèles appariés, pondérations,
        robots.txt) ; toute la chaîne en un schéma ; les trois carnets et la classification par règles,
        embeddings et modèles de langage ; les calculs déroulés sur des cas réels ; comment lancer et
        reprendre une campagne ; les données collectées ; portée, limites et sources. Quarante-trois
        diapositives.

  Un-indice-de-prix-a-partir-du-web_AfDB-DI4A.pdf:
    order: 2
    lang: fr
    group: web-price-index-deck
    download: A_Price_Index_Built_From_The_Web_Three_Notebooks_Eight_Countries
    title:
      en: "A price index built from the web — three notebooks, eight countries, two families of sources"
      fr: "Un indice de prix à partir du web — trois carnets, huit pays, deux familles de sources"
    description:
      en: >-
        French version of the deck: purpose, concepts, the whole chain, the three notebooks and
        classification, worked calculations, running a campaign, data collected, scope and limits.
      fr: >-
        Comment un indice de prix expérimental est construit à partir des sites de commerce en ligne
        et des publications officielles de huit pays africains. L'objectif et ce que le dispositif ne
