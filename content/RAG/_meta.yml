# ---------------------------------------------------------------------------
# Theme metadata — Retrieval-Augmented Generation (folder: content/RAG)
# ---------------------------------------------------------------------------
order: 5
icon: chat
cover: _cover.svg

title:
  en: Generative AI & RAG Assistants
  fr: IA générative et assistants RAG

description:
  en: >-
    Build an assistant that reads your institution's own publications and answers with the document,
    section and page, checks the figures it quotes and says "I don't know" when the answer is not
    there. These notebooks compare keyword, semantic and hybrid retrieval, handle four languages in
    one collection and show how to keep unpublished material confidential.
  fr: >-
    Construisez un assistant qui lit les publications de votre institution et répond en citant le
    document, la section et la page, vérifie les chiffres qu'il cite et dit « je ne sais pas » quand
    l'information est absente. Ces notebooks comparent la recherche par mots-clés, sémantique et
    hybride, gèrent quatre langues dans une même collection et montrent comment protéger les
    documents non publiés.

documents:

  ATI2026_AfDB_RAG_hands-on_EN.ipynb:
    group: rag-hands-on-lab          # pairs the EN and FR versions in one card
    order: 1
    download: RAG_Assistant_For_Statistical_Publications_Hands_On_Lab
    title:
      en: "Hands-on lab — Query your institution's documents with a RAG assistant"
      fr: "Lab pratique — Interroger les documents de votre institution avec un assistant RAG"
    description:
      en: >-
        Load a collection of PDF publications, prepare it and ask questions in three cells. Then work
        through four exercises: build your assistant, ask and verify, compare retrieval methods
        (BM25, embeddings, hybrid, reranking) and handle out-of-scope questions. Works even without a
        language model.
      fr: >-
        Chargez une collection de publications PDF, préparez-la et posez vos questions en trois
        cellules. Puis quatre exercices : créer votre assistant, interroger et vérifier, comparer les
        méthodes de recherche (BM25, embeddings, hybride, reclassement) et gérer les questions hors
        champ. Fonctionne même sans modèle de langage.

  ATI2026_BAD_RAG_atelier_FR.ipynb:
    group: rag-hands-on-lab          # pairs the EN and FR versions in one card
    order: 1
    download: RAG_Assistant_For_Statistical_Publications_Hands_On_Lab
    title:
      en: "Hands-on lab — Query your institution's documents with a RAG assistant"
      fr: "Lab pratique — Interroger les documents de votre institution avec un assistant RAG"
    description:
      en: >-
        French version of the hands-on lab: load PDF publications, ask grounded questions in three
