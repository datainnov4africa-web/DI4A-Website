      fr: >-
        Une collection, quatre langues : indexez ensemble des publications en anglais, français,
        espagnol et portugais, interrogez dans n'importe quelle langue et obtenez une réponse sourcée
        et citée. Avec détection de langue, embeddings multilingues et évaluation inter-langues.

