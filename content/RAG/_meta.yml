# ---------------------------------------------------------------------------
# Theme metadata — Retrieval-Augmented Generation (folder: content/RAG)
# ---------------------------------------------------------------------------
order: 5
icon: chat
cover: _cover.svg

title:
  en: Generative AI & RAG Assistants
  fr: IA générative et assistants RAG

description:
  en: >-
    Build an assistant that reads your institution's own publications and answers with the document,
    section and page, checks the figures it quotes and says "I don't know" when the answer is not
    there. A presentation deck sets out the concepts, the evidence and the production practices;
    two notebooks compare keyword, semantic and hybrid retrieval, handle four languages in one
    collection and show how to keep unpublished material confidential.
  fr: >-
    Construisez un assistant qui lit les publications de votre institution et répond en citant le
    document, la section et la page, vérifie les chiffres qu'il cite et dit « je ne sais pas » quand
    l'information est absente. Une présentation pose les concepts, les preuves et les bonnes
    pratiques de production ; deux notebooks comparent la recherche par mots-clés, sémantique et
    hybride, gèrent quatre langues dans une même collection et montrent comment protéger les
    documents non publiés.

documents:

  AfDB_DI4A_RAG_session_slides_EN.pdf:
    group: rag-course-deck            # pairs the EN and FR decks whose file names differ
    order: 1
    download: RAG_For_Statistical_Publications_Concepts_Hands_On_And_Reference_Briefing
    title:
      en: "Query your institution's documents with RAG — concepts, hands-on guide and reference briefing"
      fr: "Interroger les documents de votre institution avec le RAG — concepts, guide pratique et dossier de référence"
    description:
      en: >-
        Forty slides in two parts. First, the essentials: why a language model alone is not enough,
        how indexing and querying work, sparse, dense and hybrid retrieval, the augmented prompt, a
        three-minute set-up and four exercises that follow the notebook. Then a self-study briefing
        in six sections: foundations, how it works, evidence, evolution of RAG, advanced techniques,
        and production (evaluation, security, technology stack), with references.
      fr: >-
        Quarante diapositives en deux parties. D'abord l'essentiel : pourquoi un modèle de langage
        seul ne suffit pas, comment fonctionnent l'indexation et l'interrogation, la recherche creuse,
        dense et hybride, le prompt augmenté, une mise en route en trois minutes et quatre exercices
        qui suivent le notebook. Puis un dossier d'autoformation en six sections : fondements,
        fonctionnement, preuves, évolution du RAG, techniques avancées et production (évaluation,
        sécurité, pile technologique), avec références.

