# ---------------------------------------------------------------------------
# Theme metadata — Night-time lights (folder: content/NTL)
# Optional file. Every key is optional; missing values fall back to sensible
# defaults generated by scripts/build_site.py (with a warning in the logs).
# ---------------------------------------------------------------------------
order: 2
icon: satellite            # one of the icons in site/assets/js/icons.js
cover: _cover.webp         # image stored next to this file (16:9 recommended)

title:
  en: Night-Time Lights & Earth Observation
  fr: Lumières nocturnes et observation de la Terre

description:
  en: >-
    Learn how satellite imagery of the Earth at night becomes a free, global and timely proxy for
    economic activity. From the NASA Black Marble archive to subnational indicators, these labs walk
    you through data collection, file anatomy, quality control and eight professional use cases for
    statistical offices and central banks.
  fr: >-
    Découvrez comment les images satellitaires de la Terre la nuit deviennent un indicateur gratuit,
    mondial et rapide de l'activité économique. De l'archive NASA Black Marble aux indicateurs
    infranationaux, ces labs vous guident à travers la collecte des données, l'anatomie des fichiers,
    le contrôle qualité et huit cas d'usage professionnels pour les instituts de statistique et les
    banques centrales.

# Per-document metadata, keyed by the exact source file name.
# `download` is the descriptive name used for the published copy (no extension,
# no language code: both are added automatically, as is the _AfDB_DI4A suffix).
# Files named *_EN.* / *_FR.* are paired automatically in one bilingual card;
# `group` pairs two files whose names differ.
documents:

  # ---- Presentations -------------------------------------------------------

  night-time-lights_DI4A_EN.pdf:
    order: 1
    download: Night_Time_Lights_What_Darkness_Tells_Us_Concepts_And_Instruments
    title:
      en: "Night-time lights: what darkness tells us"
      fr: "Lumières nocturnes : ce que l'obscurité nous apprend"
    description:
      en: >-
        Reading Africa's development from space. Concepts, instruments, artefacts and the approach of
        the hands-on labs: why light betrays human activity, what the DMSP and VIIRS sensors measure,
        and how raw radiance becomes a validated subnational indicator.
      fr: >-
        Lire le développement de l'Afrique depuis l'espace. Concepts, instruments, artefacts et
        démarche des labs : pourquoi la lumière trahit l'activité humaine, ce que mesurent les capteurs
        DMSP et VIIRS, et comment la radiance brute devient un indicateur infranational validé.

  night-time-lights_DI4A_FR.pdf:
    order: 1
    download: Night_Time_Lights_What_Darkness_Tells_Us_Concepts_And_Instruments
    title:
      en: "Night-time lights: what darkness tells us"
      fr: "Lumières nocturnes : ce que l'obscurité nous apprend"
    description:
      en: >-
        French version. Concepts, instruments, artefacts and the approach of the hands-on labs, from
        raw radiance to a validated subnational indicator.
      fr: >-
        Lire le développement de l'Afrique depuis l'espace. Concepts, instruments, artefacts et
        démarche des labs : pourquoi la lumière trahit l'activité humaine, ce que mesurent les capteurs
        DMSP et VIIRS, et comment la radiance brute devient un indicateur infranational validé.

  NTL_Labs_AfDB-DI4A_EN.pdf:
    order: 2
    download: Night_Lights_Series_From_Satellite_To_Statistics_Three_Notebooks
    title:
      en: "Night lights: from satellite to statistics — the three-notebook series"
      fr: "Lumières nocturnes : du satellite aux statistiques — la série de trois notebooks"
    description:
      en: >-
        The guide to the three labs: why lights measure activity, how to collect the right NASA Black
        Marble files, open and decode them, clip them to a country, then analyse trends, regions, GDP,
        shocks and industrial zones, publish a dashboard with its reproducibility manifest, and check
        every number before release. One ISO3 code in, a public dashboard out.
      fr: >-
        Le guide des trois labs : pourquoi les lumières mesurent l'activité, comment collecter les bons
        fichiers NASA Black Marble, les ouvrir et les décoder, les découper sur un pays, puis analyser
        tendances, régions, PIB, chocs et zones industrielles, publier un tableau de bord avec son
        manifeste de reproductibilité, et vérifier chaque chiffre avant diffusion. Un code ISO3 en
        entrée, un tableau de bord public en sortie.

  NTL_Labs_AfDB-DI4A_FR.pdf:
    order: 2
    download: Night_Lights_Series_From_Satellite_To_Statistics_Three_Notebooks
    title:
      en: "Night lights: from satellite to statistics — the three-notebook series"
      fr: "Lumières nocturnes : du satellite aux statistiques — la série de trois notebooks"
    description:
      en: >-
        French version of the guide to the three-notebook series: collect, explore and understand,
        analyse and publish.
      fr: >-
        Le guide des trois labs : pourquoi les lumières mesurent l'activité, comment collecter les bons
        fichiers NASA Black Marble, les ouvrir et les décoder, les découper sur un pays, puis analyser
        tendances, régions, PIB, chocs et zones industrielles, publier un tableau de bord avec son
        manifeste de reproductibilité, et vérifier chaque chiffre avant diffusion. Un code ISO3 en
        entrée, un tableau de bord public en sortie.

  # ---- Labs ----------------------------------------------------------------

  NTL_hands-on-part-1_EN.ipynb:
    order: 10
    download: Night_Time_Lights_Lab_1_Data_Collection_NASA_Black_Marble
    title:
      en: "Lab 1 — Data collection: NASA Black Marble (VNP46)"
      fr: "Lab 1 — Collecte des données : NASA Black Marble (VNP46)"
    description:
      en: >-
        Enter a single ISO3 country code and let the notebook do the rest: it derives the national
        extent, computes the VIIRS tiles, queries NASA's catalogue for the four Black Marble products,
        builds an availability inventory and downloads a verified, size-checked sample.
      fr: >-
        Saisissez un seul code pays ISO3 et laissez le notebook faire le reste : il déduit l'emprise
        nationale, calcule les tuiles VIIRS, interroge le catalogue de la NASA pour les quatre produits
        Black Marble, dresse un inventaire de disponibilité et télécharge un échantillon vérifié.

  NTL_hands-on-part-1_FR.ipynb:
    order: 10
    download: Night_Time_Lights_Lab_1_Data_Collection_NASA_Black_Marble
    title:
      en: "Lab 1 — Data collection: NASA Black Marble (VNP46)"
      fr: "Lab 1 — Collecte des données : NASA Black Marble (VNP46)"
    description:
      en: >-
        French version of Lab 1. Enter a single ISO3 country code and let the notebook derive the
        national extent, compute the VIIRS tiles, query NASA's catalogue and download a verified
        sample of the four Black Marble products.
      fr: >-
        Saisissez un seul code pays ISO3 et laissez le notebook faire le reste : il déduit l'emprise
        nationale, calcule les tuiles VIIRS, interroge le catalogue de la NASA pour les quatre produits
        Black Marble, dresse un inventaire de disponibilité et télécharge un échantillon vérifié.

  NTL_hands-on-part-2_EN.ipynb:
    order: 11
    download: Night_Time_Lights_Lab_2_Anatomy_Of_A_Black_Marble_File
    title:
      en: "Lab 2 — Anatomy of a Black Marble file (HDF5)"
      fr: "Lab 2 — Anatomie d'un fichier Black Marble (HDF5)"
    description:
      en: >-
        A Black Marble file is not an image but a binder of twenty integer tables, each with its own
        scale, fill value and quality flags. This lab opens the HDF5 file layer by layer and shows how
        to read it correctly before computing any indicator.
      fr: >-
        Un fichier Black Marble n'est pas une image mais un classeur d'une vingtaine de tableaux
        d'entiers, chacun avec son échelle, sa valeur de remplissage et ses indicateurs de qualité.
        Ce lab ouvre le fichier HDF5 couche par couche et montre comment le lire correctement avant
        tout calcul d'indicateur.

  NTL_hands-on-part-2_FR.ipynb:
    order: 11
    download: Night_Time_Lights_Lab_2_Anatomy_Of_A_Black_Marble_File
    title:
      en: "Lab 2 — Anatomy of a Black Marble file (HDF5)"
      fr: "Lab 2 — Anatomie d'un fichier Black Marble (HDF5)"
    description:
      en: >-
        French version of Lab 2. Opens the Black Marble HDF5 file layer by layer: products, scale
        factors, fill values, quality flags and masks, so that indicators are computed on clean data.
      fr: >-
        Un fichier Black Marble n'est pas une image mais un classeur d'une vingtaine de tableaux
        d'entiers, chacun avec son échelle, sa valeur de remplissage et ses indicateurs de qualité.
        Ce lab ouvre le fichier HDF5 couche par couche et montre comment le lire correctement avant
        tout calcul d'indicateur.

  NTL_hands-on-part-3_EN.ipynb:
    order: 12
    download: Night_Time_Lights_Lab_3_Night_Lights_And_Economic_Activity
    title:
      en: "Lab 3 — Night-time lights and economic activity"
      fr: "Lab 3 — Lumières nocturnes et activité économique"
    description:
      en: >-
        From pixels to policy: build sum-of-lights and lit-area indicators at national and subnational
        level, link them to GDP, shocks and electricity access, then validate the proxy against
        independent sources. Key messages are generated automatically with a confidence level.
      fr: >-
        Des pixels aux politiques publiques : construisez des indicateurs de somme des lumières et de
        surface éclairée aux niveaux national et infranational, reliez-les au PIB, aux chocs et à
        l'accès à l'électricité, puis validez l'indicateur avec des sources indépendantes. Les messages
        clés sont générés automatiquement avec un niveau de confiance.

  NTL_hands-on-part-3_FR.ipynb:
    order: 12
    download: Night_Time_Lights_Lab_3_Night_Lights_And_Economic_Activity
    title:
      en: "Lab 3 — Night-time lights and economic activity"
      fr: "Lab 3 — Lumières nocturnes et activité économique"
    description:
      en: >-
        French version of Lab 3. Build sum-of-lights and lit-area indicators, link them to GDP, shocks
        and electricity access, and validate the proxy against independent sources.
      fr: >-
        Des pixels aux politiques publiques : construisez des indicateurs de somme des lumières et de
        surface éclairée aux niveaux national et infranational, reliez-les au PIB, aux chocs et à
        l'accès à l'électricité, puis validez l'indicateur avec des sources indépendantes. Les messages
        clés sont générés automatiquement avec un niveau de confiance.

