<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A price index curve over a shopping basket of goods">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00392A"/>
      <stop offset="0.55" stop-color="#00553A"/>
      <stop offset="1" stop-color="#00704A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5C242"/>
      <stop offset="1" stop-color="#E9A825"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5C242" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F5C242" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#00291C" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="160" cy="560" r="190" fill="#ffffff" fill-opacity="0.05"/>

  <!-- chart card -->
  <g filter="url(#shadow)">
    <rect x="430" y="110" width="640" height="420" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <g stroke="#ffffff" stroke-opacity="0.15">
      <line x1="480" y1="180" x2="1030" y2="180"/><line x1="480" y1="250" x2="1030" y2="250"/>
      <line x1="480" y1="320" x2="1030" y2="320"/><line x1="480" y1="390" x2="1030" y2="390"/><line x1="480" y1="460" x2="1030" y2="460"/>
    </g>
    <path d="M480 430 L560 410 L640 420 L720 370 L800 350 L880 300 L960 280 L1030 220 V460 H480 Z" fill="url(#area)"/>
    <path d="M480 430 L560 410 L640 420 L720 370 L800 350 L880 300 L960 280 L1030 220" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#F5C242" stroke="#00392A" stroke-width="3">
      <circle cx="480" cy="430" r="8"/><circle cx="640" cy="420" r="8"/><circle cx="800" cy="350" r="8"/><circle cx="960" cy="280" r="8"/><circle cx="1030" cy="220" r="10"/>
    </g>
    <text x="1030" y="192" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#F5C242">+4.2 %</text>
    <text x="480" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" fill-opacity="0.7" letter-spacing="2">CPI · 100 = BASE YEAR</text>
  </g>

  <!-- basket -->
  <g transform="translate(120 230)" filter="url(#shadow)">
    <path d="M30 110 L60 40 H230 L260 110 Z" fill="#00A86A"/>
    <path d="M40 110 H250 L232 250 H58 Z" fill="#00A86A"/>
    <path d="M40 110 H250" stroke="#00392A" stroke-opacity="0.35" stroke-width="6"/>
    <g stroke="#00392A" stroke-opacity="0.25" stroke-width="5">
      <line x1="90" y1="120" x2="100" y2="240"/><line x1="145" y1="120" x2="145" y2="240"/><line x1="200" y1="120" x2="190" y2="240"/>
    </g>
    <path d="M70 40 C70 -10 110 -30 145 -30 C180 -30 220 -10 220 40" fill="none" stroke="#F5C242" stroke-width="12" stroke-linecap="round"/>
    <!-- goods -->
    <circle cx="110" cy="30" r="26" fill="#F5C242"/>
    <rect x="150" y="-5" width="40" height="52" rx="6" fill="#ffffff" fill-opacity="0.9"/>
    <circle cx="200" cy="26" r="20" fill="#E9A825"/>
  </g>

  <!-- coins -->
  <g fill="#F5C242" stroke="#B57E12" stroke-width="3">
    <ellipse cx="330" cy="520" rx="34" ry="12"/><ellipse cx="330" cy="505" rx="34" ry="12"/><ellipse cx="330" cy="490" rx="34" ry="12"/>
    <ellipse cx="390" cy="535" rx="34" ry="12"/><ellipse cx="390" cy="520" rx="34" ry="12"/>
  </g>
</svg>
